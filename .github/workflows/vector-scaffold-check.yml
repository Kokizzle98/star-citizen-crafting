name: VECTOR Scaffold Check

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/**'
      - 'middleware.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'next.config.mjs'
      - '.eslintrc.json'
      - '.github/workflows/vector-scaffold-check.yml'
      - '.env.example'
  pull_request:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
