name: VECTOR Multi-Source Item Data Audit V6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/scmdb/**'
      - 'vector_item_data_audit_v4_universal.py'
      - 'vector_item_data_audit_v5_profiler.py'
      - 'vector_item_data_audit_v6_multisource.py'
      - 'VECTOR_V5_RESOLVER_DEFINITION.json'
      - '.github/workflows/vector-item-data-audit.yml'

permissions:
  contents: write

concurrency:
  group: vector-item-data-audit-v6
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate inputs
        run: |
          test -f data/scmdb/latest.json
          test -f vector_item_data_audit_v4_universal.py
          test -f vector_item_data_audit_v5_profiler.py
          test -f vector_item_data_audit_v6_multisource.py
          test -f VECTOR_V5_RESOLVER_DEFINITION.json

      - name: Run V6 multi-source resolver
        run: |
          rm -rf vector-item-audit-v6-multisource
          python vector_item_data_audit_v6_multisource.py data/scmdb \
            --config VECTOR_V5_RESOLVER_DEFINITION.json \
            --out vector-item-audit-v6-multisource

      - name: Validate V6 outputs
        run: |
          test -f vector-item-audit-v6-multisource/summary.json
          test -f vector-item-audit-v6-multisource/live/resolver_coverage.csv
          test -f vector-item-audit-v6-multisource/live/multisource_candidates.csv
          test -f vector-item-audit-v6-multisource/ptu/resolver_coverage.csv

      - name: Publish audit results
        run: |
          rm -rf data/audit-v6
          cp -R vector-item-audit-v6-multisource data/audit-v6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audit-v6
          if git diff --cached --quiet; then
            echo 'No V6 audit changes to commit.'
          else
            git commit -m 'chore(audit): update VECTOR V6 multi-source audit [skip ci]'
            git push
          fi

      - name: Upload V6 artifact
        uses: actions/upload-artifact@v7
        with:
          name: vector-item-audit-v6-multisource
          path: vector-item-audit-v6-multisource/
