name: SCMDB Full Data Mirror

on:
  workflow_dispatch:

  schedule:
    # Einmal täglich automatische Aktualisierung
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: scmdb-full-data-sync
  cancel-in-progress: false

jobs:
  sync:
    name: SCMDB Full Mirror synchronisieren
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # 1. Eigenes Repository laden
      # ------------------------------------------------------------

      - name: Eigenes Repository auschecken
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. Node.js bereitstellen
      # ------------------------------------------------------------

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ------------------------------------------------------------
      # 3. SCMDB_DATA Mirror laden
      # ------------------------------------------------------------

      - name: Öffentlichen SCMDB_DATA Mirror herunterladen
        shell: bash
        run: |
          set -euo pipefail

          echo "Lade SCMDB_DATA..."

          rm -rf /tmp/SCMDB_DATA

          git clone \
            --depth 1 \
            https://github.com/KrovaxCode/SCMDB_DATA.git \
            /tmp/SCMDB_DATA

          if [ ! -d "/tmp/SCMDB_DATA/data" ]; then
            echo "FEHLER: data-Verzeichnis wurde nicht gefunden."
            exit 1
          fi

          echo "SCMDB_DATA erfolgreich heruntergeladen."


      # ------------------------------------------------------------
      # 4. Grundlegende Validierung der Quelle
      # ------------------------------------------------------------

      - name: SCMDB Quelldaten validieren
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/tmp/SCMDB_DATA/data"

          echo "Prüfe zentrale SCMDB-Dateien..."

          test -f "$SOURCE/latest.json"
          test -f "$SOURCE/game-versions.json"
          test -f "$SOURCE/versions.json"
          test -f "$SOURCE/changelog.json"

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const source = "/tmp/SCMDB_DATA/data";

          const requiredJsonFiles = [
            "latest.json",
            "game-versions.json",
            "versions.json",
            "changelog.json"
          ];

          for (const file of requiredJsonFiles) {

            const fullPath = path.join(source, file);

            try {

              const raw = fs.readFileSync(fullPath, "utf8");

              JSON.parse(raw);

              console.log(`OK: ${file}`);

            }
            catch (error) {

              console.error(`Ungültige JSON-Datei: ${file}`);
              console.error(error);

              process.exit(1);

            }

          }

          console.log("Grundlegende SCMDB-JSON-Validierung erfolgreich.");

          NODE


      # ------------------------------------------------------------
      # 5. Gesamten data-Ordner spiegeln
      # ------------------------------------------------------------

      - name: Vollständigen SCMDB Data Mirror übernehmen
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/tmp/SCMDB_DATA/data/"
          TARGET="data/scmdb/"

          mkdir -p "$TARGET"

          echo "Synchronisiere vollständigen SCMDB-Datenbestand..."

          rsync \
            -av \
            --delete \
            "$SOURCE" \
            "$TARGET"

          echo "Mirror synchronisiert."


      # ------------------------------------------------------------
      # 6. Eigenes Mirror-Metadata erzeugen
      # ------------------------------------------------------------

      - name: Lokales Mirror-Metadata erzeugen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const dataDir = "data/scmdb";

          const files = fs
            .readdirSync(dataDir)
            .filter(file => file.endsWith(".json"))
            .sort();

          const craftingBlueprints = files.filter(
            file => file.startsWith("crafting_blueprints-")
          );

          const craftingItems = files.filter(
            file => file.startsWith("crafting_items-")
          );

          const miningData = files.filter(
            file => file.startsWith("mining_data-")
          );

          const miningEquipment = files.filter(
            file => file.startsWith("mining_equipment-")
          );

          const merged = files.filter(
            file => file.startsWith("merged-")
          );

          const missions = files.filter(
            file => file.startsWith("mission-history-")
          );

          function classify(files) {

            return {

              live: files.filter(
                file => file.toLowerCase().includes("-live.")
              ),

              ptu: files.filter(
                file => file.toLowerCase().includes("-ptu.")
              ),

              other: files.filter(file => {

                const value = file.toLowerCase();

                return (
                  !value.includes("-live.") &&
                  !value.includes("-ptu.")
                );

              })

            };

          }

          const manifest = {

            source: "KrovaxCode/SCMDB_DATA",

            generatedAt: new Date().toISOString(),

            totalJsonFiles: files.length,

            datasets: {

              craftingBlueprints:
                classify(craftingBlueprints),

              craftingItems:
                classify(craftingItems),

              miningData:
                classify(miningData),

              miningEquipment:
                classify(miningEquipment),

              merged:
                classify(merged),

              missionHistory:
                classify(missions)

            },

            staticFiles: files.filter(file =>

              !file.startsWith("crafting_blueprints-") &&
              !file.startsWith("crafting_items-") &&
              !file.startsWith("mining_data-") &&
              !file.startsWith("mining_equipment-") &&
              !file.startsWith("merged-") &&
              !file.startsWith("mission-history-")

            )

          };

          fs.writeFileSync(
            path.join(dataDir, "_local-mirror-manifest.json"),
            JSON.stringify(manifest, null, 2) + "\n",
            "utf8"
          );

          console.log(
            `Mirror-Manifest erstellt: ${files.length} JSON-Dateien`
          );

          NODE


      # ------------------------------------------------------------
      # 7. Crafting-Datensätze prüfen
      # ------------------------------------------------------------

      - name: Crafting-Datensätze prüfen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const directory = "data/scmdb";

          const files = fs.readdirSync(directory);

          const blueprintFiles = files.filter(
            file => file.startsWith("crafting_blueprints-")
          );

          const itemFiles = files.filter(
            file => file.startsWith("crafting_items-")
          );

          if (blueprintFiles.length === 0) {

            throw new Error(
              "Keine crafting_blueprints-Datei gefunden."
            );

          }

          if (itemFiles.length === 0) {

            throw new Error(
              "Keine crafting_items-Datei gefunden."
            );

          }

          console.log(
            `Blueprint-Datensätze: ${blueprintFiles.length}`
          );

          console.log(
            `Item-Datensätze: ${itemFiles.length}`
          );


          // --------------------------------------------------------
          // Item-Datensätze prüfen
          // --------------------------------------------------------

          for (const file of itemFiles) {

            const fullPath = path.join(directory, file);

            const data = JSON.parse(
              fs.readFileSync(fullPath, "utf8")
            );

            if (!Array.isArray(data.items)) {

              throw new Error(
                `${file}: items[] fehlt`
              );

            }

            if (data.items.length < 100) {

              throw new Error(
                `${file}: ungewöhnlich wenige Items`
              );

            }

            if (!Array.isArray(data.fireModesPools)) {

              throw new Error(
                `${file}: fireModesPools[] fehlt`
              );

            }


            // ------------------------------------------------------
            // Recoil prüfen
            // ------------------------------------------------------

            let recoilWeapons = 0;

            for (const item of data.items) {

              const index = item.fireModesIndex;

              if (!Number.isInteger(index)) {
                continue;
              }

              const modes = data.fireModesPools[index];

              if (!Array.isArray(modes)) {
                continue;
              }

              const hasRecoil = modes.some(mode => {

                if (mode?.recoil) {
                  return true;
                }

                if (Array.isArray(mode?.sequenceEntries)) {

                  return mode.sequenceEntries.some(
                    entry => entry?.recoil
                  );

                }

                return false;

              });

              if (hasRecoil) {
                recoilWeapons++;
              }

            }

            console.log(
              `${file}: ` +
              `${data.items.length} Items, ` +
              `${data.fireModesPools.length} FireMode-Pools, ` +
              `${recoilWeapons} Waffen mit Recoil`
            );


            if (recoilWeapons === 0) {

              throw new Error(
                `${file}: keine Recoil-Daten gefunden`
              );

            }

          }


          // --------------------------------------------------------
          // Blueprint-Datensätze prüfen
          // --------------------------------------------------------

          for (const file of blueprintFiles) {

            const fullPath = path.join(directory, file);

            const data = JSON.parse(
              fs.readFileSync(fullPath, "utf8")
            );

            const collection =
              data.blueprints ??
              data.items ??
              data.data ??
              data;

            if (!Array.isArray(collection)) {

              throw new Error(
                `${file}: Blueprint-Sammlung nicht erkannt`
              );

            }

            if (collection.length < 100) {

              throw new Error(
                `${file}: ungewöhnlich wenige Blueprints`
              );

            }

            console.log(
              `${file}: ${collection.length} Blueprints`
            );

          }

          console.log(
            "Crafting-Datensätze erfolgreich geprüft."
          );

          NODE


      # ------------------------------------------------------------
      # 8. Änderungen feststellen
      # ------------------------------------------------------------

      - name: Änderungen prüfen
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/scmdb && \
             [ -z "$(git status --porcelain -- data/scmdb)" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "Keine Änderungen gefunden."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Neue oder geänderte SCMDB-Daten gefunden."

          fi


      # ------------------------------------------------------------
      # 9. Nur bei Datenänderung committen
      # ------------------------------------------------------------

      - name: SCMDB-Daten committen
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "SCMDB Sync Bot"

          git config \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add data/scmdb

          git commit \
            -m "chore: sync complete SCMDB data mirror"

          git push


      # ------------------------------------------------------------
      # 10. Workflow-Zusammenfassung
      # ------------------------------------------------------------

      - name: Zusammenfassung erstellen
        shell: bash
        run: |
          {
            echo "# SCMDB Full Data Mirror"
            echo
            echo "Quelle:"
            echo "\`KrovaxCode/SCMDB_DATA\`"
            echo
            echo "Gespiegelte JSON-Dateien:"
            echo
            echo '```'
            find data/scmdb \
              -maxdepth 1 \
              -type f \
              -name "*.json" \
              -printf "%f\n" \
              | sort
            echo '```'
            echo
            echo "Lokales Manifest:"
            echo "\`data/scmdb/_local-mirror-manifest.json\`"
            echo
            echo "Daten geändert:"
            echo "\`${{ steps.changes.outputs.changed }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
