name: SCMDB Mirror Sync V2

# MIRROR-WORKFLOW-V2 (docs/proposed/DATASET_PIPELINE_V1.md sections 31, 35.1, 36 to 39).
#
# Never pushes to develop or main, never merges, never activates anything in Production,
# never writes to a database. It works only on the rolling, unprotected branch
# automation/scmdb-sync and, on a real change, proposes the mirror through a pull request
# that the owner reviews and merges by hand.
#
# Mode: repository variable SCMDB_SYNC_MODE = "dry-run" (default when unset) or "publish".
# A dry run computes everything and reports it in the job summary and the artifact, but
# pushes nothing and opens no pull request. The manual run can force dry-run at any time.

on:
  workflow_dispatch:
    inputs:
      force_dry_run:
        description: "Force a dry run, whatever SCMDB_SYNC_MODE says (nothing is pushed, no pull request)"
        type: boolean
        default: true

  schedule:
    # Once a day
    - cron: "17 3 * * *"

# Least privilege: the branch push and the pull request need exactly these two.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scmdb-full-data-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: automation/scmdb-sync
  BASE_BRANCH: develop
  OBSERVATION_FILE: data/scmdb-sync/observations.jsonl
  UPSTREAM_URL: https://github.com/KrovaxCode/SCMDB_DATA.git

jobs:
  sync:
    name: SCMDB mirror sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ------------------------------------------------------------
      # 1. Own repository (full history: needed to merge develop into the sync branch)
      # ------------------------------------------------------------

      - name: Eigenes Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ------------------------------------------------------------
      # 2. Tools and mode
      #    The scripts of this run are copied out of the work tree, so that switching to
      #    the sync branch cannot change the tools that decide.
      # ------------------------------------------------------------

      - name: Werkzeuge sichern und Betriebsart bestimmen
        id: mode
        shell: bash
        env:
          SCMDB_SYNC_MODE: ${{ vars.SCMDB_SYNC_MODE }}
          FORCE_DRY_RUN: ${{ inputs.force_dry_run }}
        run: |
          set -euo pipefail

          TOOLS="$RUNNER_TEMP/tools"
          SYNC_DIR="$RUNNER_TEMP/scmdb-sync"
          rm -rf "$TOOLS" "$SYNC_DIR"
          mkdir -p "$SYNC_DIR/out"
          cp -R scripts "$TOOLS"

          {
            echo "TOOLS=$TOOLS"
            echo "SYNC_DIR=$SYNC_DIR"
          } >> "$GITHUB_ENV"

          node "$TOOLS/scmdb-sync/decide.mjs" mode \
            --variable "$SCMDB_SYNC_MODE" \
            --force-dry-run "$FORCE_DRY_RUN" \
            | tee -a "$GITHUB_OUTPUT"


      # ------------------------------------------------------------
      # 3. Sync branch: created from develop when missing, develop merged in otherwise.
      #    Merge only: never a rebase, never a force push. A conflict is reported as BLOCKED
      #    and nothing is overwritten.
      # ------------------------------------------------------------

      - name: Sync-Branch vorbereiten
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "SCMDB Sync Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin

          if git rev-parse --verify --quiet "refs/remotes/origin/$SYNC_BRANCH" > /dev/null; then
            git checkout -B "$SYNC_BRANCH" "origin/$SYNC_BRANCH"

            if ! git merge --no-edit "origin/$BASE_BRANCH"; then
              git merge --abort || true
              {
                echo "# SCMDB Mirror Sync V2: BLOCKED"
                echo
                echo "Merging \`$BASE_BRANCH\` into \`$SYNC_BRANCH\` conflicts. Nothing was overwritten, nothing was pushed."
                echo "Owner action: resolve the conflict on \`$SYNC_BRANCH\` by hand (merge, no rebase, no force push)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::BLOCKED: merging $BASE_BRANCH into $SYNC_BRANCH conflicts"
              exit 1
            fi
          else
            git checkout -B "$SYNC_BRANCH" "origin/$BASE_BRANCH"
          fi

          git log --oneline -3


      # ------------------------------------------------------------
      # 4. SCMDB_DATA laden; Commit-SHA des Klons festhalten (Source Export Revision, 33.2)
      # ------------------------------------------------------------

      - name: Öffentlichen SCMDB_DATA Mirror herunterladen
        shell: bash
        run: |
          set -euo pipefail

          echo "Lade SCMDB_DATA..."

          rm -rf /tmp/SCMDB_DATA

          git clone \
            --depth 1 \
            "$UPSTREAM_URL" \
            /tmp/SCMDB_DATA

          if [ ! -d "/tmp/SCMDB_DATA/data" ]; then
            echo "FEHLER: data-Verzeichnis wurde nicht gefunden."
            exit 1
          fi

          # An empty or malformed value is not an error here: the precheck holds the run (HELD_FOR_REVIEW).
          SOURCE_SHA="$(git -C /tmp/SCMDB_DATA rev-parse HEAD || true)"
          SOURCE_RETRIEVED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          {
            echo "SOURCE_SHA=$SOURCE_SHA"
            echo "SOURCE_RETRIEVED_AT=$SOURCE_RETRIEVED_AT"
          } >> "$GITHUB_ENV"

          echo "SCMDB_DATA erfolgreich heruntergeladen: ${SOURCE_SHA:-unbekannt}"


      # ------------------------------------------------------------
      # 5. Source validation, mirror, manifest and crafting sanity checks (unchanged).
      #    A failure here fails the job and nothing is published.
      # ------------------------------------------------------------

      - name: SCMDB Quelldaten validieren
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/tmp/SCMDB_DATA/data"

          echo "Prüfe zentrale SCMDB-Dateien..."

          test -f "$SOURCE/latest.json"
          test -f "$SOURCE/game-versions.json"
          test -f "$SOURCE/versions.json"
          test -f "$SOURCE/changelog.json"

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const source = "/tmp/SCMDB_DATA/data";

          const requiredJsonFiles = [
            "latest.json",
            "game-versions.json",
            "versions.json",
            "changelog.json"
          ];

          for (const file of requiredJsonFiles) {

            const fullPath = path.join(source, file);

            try {

              const raw = fs.readFileSync(fullPath, "utf8");

              JSON.parse(raw);

              console.log(`OK: ${file}`);

            }
            catch (error) {

              console.error(`Ungültige JSON-Datei: ${file}`);
              console.error(error);

              process.exit(1);

            }

          }

          console.log("Grundlegende SCMDB-JSON-Validierung erfolgreich.");

          NODE


      - name: Vollständigen SCMDB Data Mirror übernehmen
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="/tmp/SCMDB_DATA/data/"
          TARGET="data/scmdb/"

          mkdir -p "$TARGET"

          echo "Synchronisiere vollständigen SCMDB-Datenbestand..."

          rsync \
            -av \
            --delete \
            "$SOURCE" \
            "$TARGET"

          echo "Mirror synchronisiert."


      - name: Lokales Mirror-Metadata erzeugen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const dataDir = "data/scmdb";

          const files = fs
            .readdirSync(dataDir)
            .filter(file => file.endsWith(".json"))
            .sort();

          const craftingBlueprints = files.filter(
            file => file.startsWith("crafting_blueprints-")
          );

          const craftingItems = files.filter(
            file => file.startsWith("crafting_items-")
          );

          const miningData = files.filter(
            file => file.startsWith("mining_data-")
          );

          const miningEquipment = files.filter(
            file => file.startsWith("mining_equipment-")
          );

          const merged = files.filter(
            file => file.startsWith("merged-")
          );

          const missions = files.filter(
            file => file.startsWith("mission-history-")
          );

          function classify(files) {

            return {

              live: files.filter(
                file => file.toLowerCase().includes("-live.")
              ),

              ptu: files.filter(
                file => file.toLowerCase().includes("-ptu.")
              ),

              other: files.filter(file => {

                const value = file.toLowerCase();

                return (
                  !value.includes("-live.") &&
                  !value.includes("-ptu.")
                );

              })

            };

          }

          const manifest = {

            source: "KrovaxCode/SCMDB_DATA",

            generatedAt: new Date().toISOString(),

            totalJsonFiles: files.length,

            datasets: {

              craftingBlueprints:
                classify(craftingBlueprints),

              craftingItems:
                classify(craftingItems),

              miningData:
                classify(miningData),

              miningEquipment:
                classify(miningEquipment),

              merged:
                classify(merged),

              missionHistory:
                classify(missions)

            },

            staticFiles: files.filter(file =>

              !file.startsWith("crafting_blueprints-") &&
              !file.startsWith("crafting_items-") &&
              !file.startsWith("mining_data-") &&
              !file.startsWith("mining_equipment-") &&
              !file.startsWith("merged-") &&
              !file.startsWith("mission-history-")

            )

          };

          fs.writeFileSync(
            path.join(dataDir, "local-mirror-manifest.json"),
            JSON.stringify(manifest, null, 2) + "\n",
            "utf8"
          );

          console.log(
            `Mirror-Manifest erstellt: ${files.length} JSON-Dateien`
          );

          NODE


      - name: Crafting-Datensätze prüfen
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'

          const fs = require("fs");
          const path = require("path");

          const directory = "data/scmdb";

          const files = fs.readdirSync(directory);

          const blueprintFiles = files.filter(
            file => file.startsWith("crafting_blueprints-")
          );

          const itemFiles = files.filter(
            file => file.startsWith("crafting_items-")
          );

          if (blueprintFiles.length === 0) {

            throw new Error(
              "Keine crafting_blueprints-Datei gefunden."
            );

          }

          if (itemFiles.length === 0) {

            throw new Error(
              "Keine crafting_items-Datei gefunden."
            );

          }

          console.log(
            `Blueprint-Datensätze: ${blueprintFiles.length}`
          );

          console.log(
            `Item-Datensätze: ${itemFiles.length}`
          );


          // --------------------------------------------------------
          // Item-Datensätze prüfen
          // --------------------------------------------------------

          for (const file of itemFiles) {

            const fullPath = path.join(directory, file);

            const data = JSON.parse(
              fs.readFileSync(fullPath, "utf8")
            );

            if (!Array.isArray(data.items)) {

              throw new Error(
                `${file}: items[] fehlt`
              );

            }

            if (data.items.length < 100) {

              throw new Error(
                `${file}: ungewöhnlich wenige Items`
              );

            }

            if (!Array.isArray(data.fireModesPools)) {

              throw new Error(
                `${file}: fireModesPools[] fehlt`
              );

            }


            // ------------------------------------------------------
            // Recoil prüfen
            // ------------------------------------------------------

            let recoilWeapons = 0;

            for (const item of data.items) {

              const index = item.fireModesIndex;

              if (!Number.isInteger(index)) {
                continue;
              }

              const modes = data.fireModesPools[index];

              if (!Array.isArray(modes)) {
                continue;
              }

              const hasRecoil = modes.some(mode => {

                if (mode?.recoil) {
                  return true;
                }

                if (Array.isArray(mode?.sequenceEntries)) {

                  return mode.sequenceEntries.some(
                    entry => entry?.recoil
                  );

                }

                return false;

              });

              if (hasRecoil) {
                recoilWeapons++;
              }

            }

            console.log(
              `${file}: ` +
              `${data.items.length} Items, ` +
              `${data.fireModesPools.length} FireMode-Pools, ` +
              `${recoilWeapons} Waffen mit Recoil`
            );


            if (recoilWeapons === 0) {

              throw new Error(
                `${file}: keine Recoil-Daten gefunden`
              );

            }

          }


          // --------------------------------------------------------
          // Blueprint-Datensätze prüfen
          // --------------------------------------------------------

          for (const file of blueprintFiles) {

            const fullPath = path.join(directory, file);

            const data = JSON.parse(
              fs.readFileSync(fullPath, "utf8")
            );

            const collection =
              data.blueprints ??
              data.items ??
              data.data ??
              data;

            if (!Array.isArray(collection)) {

              throw new Error(
                `${file}: Blueprint-Sammlung nicht erkannt`
              );

            }

            if (collection.length < 100) {

              throw new Error(
                `${file}: ungewöhnlich wenige Blueprints`
              );

            }

            console.log(
              `${file}: ${collection.length} Blueprints`
            );

          }

          console.log(
            "Crafting-Datensätze erfolgreich geprüft."
          );

          NODE


      # ------------------------------------------------------------
      # 6. Candidate = data/scmdb after the rsync. Baseline = origin/develop (not the sync
      #    branch). The CLI uses the complete loader result of both sides (files, fileNames,
      #    unreadable); this workflow never hands over only the files.
      # ------------------------------------------------------------

      - name: Domain-Precheck ausführen
        shell: bash
        run: |
          set -euo pipefail

          OBSERVED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

          node "$TOOLS/domain-precheck.mjs" \
            --baseline-ref "origin/$BASE_BRANCH" \
            --candidate-dir data/scmdb \
            --candidate-source-sha "$SOURCE_SHA" \
            --source-retrieved-at "$SOURCE_RETRIEVED_AT" \
            --observed-at "$OBSERVED_AT" \
            --emit json \
            > "$SYNC_DIR/precheck.json"

          echo "Precheck geschrieben."


      # ------------------------------------------------------------
      # 7. Decision (scripts/scmdb-sync/decide.mjs, unit-tested)
      # ------------------------------------------------------------

      - name: Entscheidung treffen
        id: decide
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_REASON: ${{ steps.mode.outputs.mode_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          node "$TOOLS/scmdb-sync/decide.mjs" decide \
            --precheck "$SYNC_DIR/precheck.json" \
            --mode "$MODE" \
            --mode-reason "$MODE_REASON" \
            --run-url "$RUN_URL" \
            --out-dir "$SYNC_DIR/out" \
            | tee -a "$GITHUB_OUTPUT"

          cat "$SYNC_DIR/out/summary.md" >> "$GITHUB_STEP_SUMMARY"


      # ------------------------------------------------------------
      # 8. Apply the outcome to the sync branch (local commits only; the push is a later step)
      #    OBSERVE  proven UNCHANGED against develop: drop the work-tree changes (manifest
      #             timestamp, non-trigger files); data/scmdb goes back to develop, so a
      #             stale pending proposal is not kept alive.
      #    HELD     drop the work-tree changes, keep the branch as it is, append observations.
      #    PUBLISH  commit the mirror change (the manifest alone is never a change) plus
      #             observations.
      # ------------------------------------------------------------

      - name: Ergebnis auf den Sync-Branch anwenden
        shell: bash
        env:
          OUTCOME: ${{ steps.decide.outputs.outcome }}
        run: |
          set -euo pipefail

          MANIFEST="data/scmdb/local-mirror-manifest.json"
          MIRROR_COMMIT=false

          case "$OUTCOME" in
            OBSERVE)
              git restore --source="origin/$BASE_BRANCH" --staged --worktree -- data/scmdb
              git clean -fdq -- data/scmdb
              if ! git diff --cached --quiet; then
                git commit -q -m "chore(scmdb-sync): restore data/scmdb to $BASE_BRANCH" \
                  -m "Upstream matches the baseline again; a pending mirror proposal on this branch is withdrawn."
              fi
              ;;
            HELD)
              git restore --source=HEAD --staged --worktree -- data/scmdb
              git clean -fdq -- data/scmdb
              ;;
            PUBLISH)
              if [ -z "$(git status --porcelain -- data/scmdb | grep -v "$MANIFEST" || true)" ]; then
                git restore --source=HEAD --staged --worktree -- "$MANIFEST"
              else
                git add -A -- data/scmdb
                MIRROR_COMMIT=true
              fi
              ;;
            *)
              echo "::error::Unknown outcome: $OUTCOME"
              exit 1
              ;;
          esac

          node "$TOOLS/scmdb-sync/decide.mjs" append \
            --file "$OBSERVATION_FILE" \
            --lines "$SYNC_DIR/out/observation-lines.jsonl"
          git add -- "$OBSERVATION_FILE"

          # The record only grows: no staged deletion in it.
          DELETED="$(git diff --cached --numstat -- "$OBSERVATION_FILE" | awk '{print $2}')"
          if [ "${DELETED:-0}" != "0" ]; then
            echo "::error::The observation record is not append-only."
            exit 1
          fi

          if [ "$MIRROR_COMMIT" = "true" ]; then
            git commit -q -F "$SYNC_DIR/out/commit-message.txt"
          else
            git commit -q -F "$SYNC_DIR/out/observation-commit-message.txt"
          fi

          {
            echo "## Local result on \`$SYNC_BRANCH\`"
            echo
            echo "Commits ahead of \`$BASE_BRANCH\`:"
            echo
            echo '```'
            git log --oneline "origin/$BASE_BRANCH..HEAD"
            echo '```'
            echo
            echo "Changed files against \`$BASE_BRANCH\`:"
            echo
            echo '```'
            git diff --stat --stat-width=100 "origin/$BASE_BRANCH" HEAD | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      # ------------------------------------------------------------
      # 9. Publish mode only: plain push of the sync branch. Never develop, never main,
      #    never a force push. The default token cannot create or update workflow files:
      #    a merge that brings workflow changes from develop is rejected and reported.
      # ------------------------------------------------------------

      - name: Sync-Branch pushen
        if: steps.mode.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail

          if ! git push origin "$SYNC_BRANCH" 2> "$SYNC_DIR/push.err"; then
            cat "$SYNC_DIR/push.err"
            {
              echo "## Push rejected"
              echo
              echo "Pushing \`$SYNC_BRANCH\` failed. Nothing else was changed. If the message mentions the \`workflows\` permission,"
              echo "the merge of \`$BASE_BRANCH\` brought workflow changes that the default token may not push."
              echo
              echo '```'
              cat "$SYNC_DIR/push.err"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::BLOCKED: push of $SYNC_BRANCH was rejected"
            exit 1
          fi

          echo "Pushed $SYNC_BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"


      # ------------------------------------------------------------
      # 10. Publish mode, real change only: open or update the pull request against develop.
      #     No auto-merge, no merge of any kind. Fallback when Actions may not create pull
      #     requests: a ready compare link and the pull request text in the job summary.
      # ------------------------------------------------------------

      - name: Pull Request öffnen oder aktualisieren
        if: steps.mode.outputs.mode == 'publish' && steps.decide.outputs.outcome == 'PUBLISH'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TITLE="$(cat "$SYNC_DIR/out/pr-title.txt")"
          BODY_FILE="$SYNC_DIR/out/pr-body.md"
          COMPARE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE_BRANCH...$SYNC_BRANCH?expand=1"

          EXISTING="$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE"
            {
              echo "## Pull request updated"
              echo
              echo "#$EXISTING was updated. Close and reopen it once to start the checks (pull requests changed by a workflow do not start them)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "$TITLE" --body-file "$BODY_FILE" 2> "$SYNC_DIR/pr.err"; then
            {
              echo "## Pull request opened"
              echo
              echo "Close and reopen it once to start the checks (pull requests opened by a workflow do not start them)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat "$SYNC_DIR/pr.err"
          if grep -qi "not permitted to create or approve pull requests" "$SYNC_DIR/pr.err"; then
            {
              echo "## Pull request not created automatically"
              echo
              echo "GitHub Actions may not create pull requests in this repository (repository setting). The branch is pushed."
              echo
              echo "Open it here: $COMPARE_URL"
              echo
              echo "Title: $TITLE"
              echo
              echo "<details><summary>Pull request text</summary>"
              echo
              cat "$BODY_FILE"
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Actions may not create pull requests here. Compare link and text are in the job summary."
            exit 0
          fi

          echo "::error::Creating the pull request failed."
          exit 1


      # ------------------------------------------------------------
      # 10b. Open pull request of the sync branch, when this run proposes no mirror change.
      #      Reading is allowed in every mode and only reports in the job summary. A withdrawn
      #      proposal (OBSERVE) updates title and text of the open pull request in publish mode
      #      only. It is never closed and never merged. A held run leaves it as it is.
      # ------------------------------------------------------------

      - name: Offenen Sync-PR abfragen
        id: openpr
        if: steps.decide.outputs.outcome != 'PUBLISH'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          OUTCOME: ${{ steps.decide.outputs.outcome }}
        run: |
          set -euo pipefail

          if ! PR="$(gh pr list --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty' 2> "$SYNC_DIR/prlist.err")"; then
            cat "$SYNC_DIR/prlist.err"
            echo "::warning::The lookup of open pull requests failed. No pull request is changed."
            PR="unknown"
          fi

          echo "number=$PR" >> "$GITHUB_OUTPUT"

          node "$TOOLS/scmdb-sync/decide.mjs" pr-note \
            --outcome "$OUTCOME" \
            --mode "$MODE" \
            --pr "$PR" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Zurückgenommenen Mirror-Vorschlag im PR vermerken
        if: steps.mode.outputs.mode == 'publish' && steps.decide.outputs.outcome == 'OBSERVE' && steps.openpr.outputs.number != '' && steps.openpr.outputs.number != 'unknown'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.openpr.outputs.number }}
        run: |
          set -euo pipefail

          gh pr edit "$PR_NUMBER" \
            --title "$(cat "$SYNC_DIR/out/pr-withdrawn-title.txt")" \
            --body-file "$SYNC_DIR/out/pr-withdrawn-body.md"

          echo "Updated title and text of #$PR_NUMBER (mirror proposal withdrawn). It stays open." | tee -a "$GITHUB_STEP_SUMMARY"


      # ------------------------------------------------------------
      # 11. Report
      # ------------------------------------------------------------

      - name: Ergebnis als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scmdb-sync-report
          path: ${{ runner.temp }}/scmdb-sync
          retention-days: 14
          if-no-files-found: ignore

      # A held run is visible as a failed job (after observations were recorded).
      - name: Gehaltenen Lauf sichtbar machen
        if: steps.decide.outputs.outcome == 'HELD'
        shell: bash
        run: |
          echo "::error::HELD_FOR_REVIEW: no mirror commit, no pull request. See the job summary for the reasons."
          exit 1
